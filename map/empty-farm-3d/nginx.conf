server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location /assets/ { expires 7d; add_header Cache-Control "public, immutable"; }
  location /worlds/ { expires 1h; add_header Cache-Control "public"; }
  location /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
}
