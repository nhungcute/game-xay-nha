server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json model/gltf-binary;
  location / { try_files $uri $uri/ /index.html; }
  location /assets/ { try_files $uri =404; expires 7d; }
  location /worlds/ { try_files $uri =404; add_header Cache-Control "no-cache"; }
}
