server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /health { default_type text/plain; return 200 "ok\n"; }

  # API (same origin, so no CORS). Body limit matches the API (64 KB).
  # Re-resolve the api container through Docker DNS: a restarted container may get a new IP,
  # and a static upstream would keep answering 502 until nginx itself restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
  }

  # Vite emits content-hashed files under /assets/*.js|css; GLB models are versioned via the manifest.
  location ~* ^/assets/.+\.(js|css)$ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /assets/models/ { add_header Cache-Control "public, max-age=86400"; types { model/gltf-binary glb; } try_files $uri =404; }
  location /worlds/ { add_header Cache-Control "no-cache"; try_files $uri =404; }

  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
