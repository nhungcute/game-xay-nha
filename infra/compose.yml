# Local deployment + optional Cloudflare quick tunnel (docs/DEPLOY_LOCAL.md).
# G1: web only (offline client). G2 adds api + postgres here.
name: xay-nha
services:
  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    image: xay-nha-web:local
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    restart: unless-stopped

  # Started only with `pnpm tunnel:up` (profile "tunnel"). Publishes the web service at a
  # random https://*.trycloudflare.com URL. Never started automatically.
  tunnel:
    image: cloudflare/cloudflared:2025.9.1
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      web:
        condition: service_healthy
    profiles: ["tunnel"]
    restart: unless-stopped
